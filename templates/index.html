<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            width: 500px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            border: none;
            padding: 12px;
            font-size: 14px;
            outline: none;
            margin-top: 10px;
            background: #1e293b;
            color: white;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
        }

        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: 500;
        }

        .real {
            color: #22c55e;
        }

        .fake {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>📰 Fake News Detector</h1>

        <form action="/predict" method="post">
            <textarea name="news" placeholder="Paste news article here..."></textarea>
            <br>
            <button type="submit">Analyze</button>
        </form>

        {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
{% endif %}
    </div>

</body>
</html>
